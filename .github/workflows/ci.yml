name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel in-flight runs for the same ref so a quick second push doesn't
# queue duplicate work. main pushes share a single slot per workflow.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Default to read-only repo permissions — individual jobs opt in to
# more if they need to (none currently do; release-please.yml handles
# write-bearing work).
permissions:
  contents: read

# Single source of truth for tool versions used across every job.
# Bumping these here updates every step at once. Keep the pnpm value
# in lockstep with the repo-root packageManager field.
env:
  NODE_VERSION: '22'
  PNPM_VERSION: '9.15.5'

jobs:
  lint-js:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Build the codegen package's lib/ — cli tests + autolinkLinux
      # require('@lucid-softworks/react-native-linux-codegen') against
      # its compiled main entry. Without this the cli test suite fails
      # with "Cannot find module".
      - name: Build packages (compiles codegen → lib/)
        run: pnpm -r run build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm lint:format
      - run: pnpm test

  lint-cpp:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-format
      - name: Check C++ formatting
        run: |
          # Same find expression as `pnpm lint:cpp`. Keep them in sync —
          # if either drifts we'll lint different files in CI vs. locally.
          # `-path '*/build/*' -prune` skips the CMake FetchContent _deps
          # tree (Hermes / Folly / Boost source) so we only lint our own
          # code.
          find vnext template/linux -path '*/build/*' -prune -o -type f \
              \( -name '*.cpp' -o -name '*.h' \) -print \
            | xargs clang-format --dry-run --Werror

  autolink-drift:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build packages
        # CLI is published as compiled JS in lib/; the workspace symlink
        # is empty until `tsc` runs. Skipping this step means
        # `pnpm exec react-native autolink-linux` resolves to a package
        # with no command registrations.
        run: pnpm -r run build
      - name: Install template deps (so RN CLI can resolve)
        working-directory: template
        run: pnpm install --no-frozen-lockfile
      - name: Check autolink output is in sync
        working-directory: template
        # Until the CLI is `tsc`-built, this is a smoke test — it will fail
        # cleanly if the JS surface drifts (autolink-linux missing,
        # unexpected new dependency declared). Once a real playground with
        # native deps lands, this becomes a hard gate.
        run: pnpm exec react-native autolink-linux --check || true

  build-vnext:
    # Single-OS build: ubuntu-24.04 is our actively-supported floor and
    # ships the libgtk-4 / libsoup-3 versions the runtime targets. The
    # README still mentions 22.04 as a deploy target, but verifying that
    # by spinning up two GH runners per PR doubled job time for marginal
    # signal — ship breaks against 22.04 will surface in real-app runs
    # before they hit a contributor's machine.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install native build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ninja-build cmake pkg-config \
            libgtk-4-dev \
            libsoup-3.0-dev \
            libglib2.0-dev \
            libboost-all-dev \
            libdouble-conversion-dev \
            libevent-dev \
            libssl-dev \
            libgoogle-glog-dev \
            libgflags-dev \
            libfast-float-dev \
            zlib1g-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libnotify-dev \
            libsecret-1-dev \
            python3 python3-pip
          # Folly's CMake reaches for Boost (context / filesystem / regex /
          # thread …) + a bunch of MODULE-required find_package() calls:
          # DoubleConversion, LibEvent, OpenSSL, FastFloat (new with
          # Folly v2024.11.18.00). The optional ones (Glog, Gflags,
          # ZLIB) get linked when present and we install them so the
          # configure isn't constantly toggling Folly compile flags
          # between runs. Our CMakeLists for the playground app also
          # pulls in libsoup3 for the image loader's network backend.
          #
          # The four trailing dev packages back the expo-* shims that
          # landed during the realworld-* harness work: GStreamer for
          # expo-camera (live preview + snap), libnotify for
          # expo-notifications, libsecret for expo-secure-store.
          # Runtime plugins (gstreamer1.0-plugins-good for pngenc,
          # gstreamer1.0-plugins-base for videotestsrc) ship with
          # libgstreamer-plugins-base1.0-dev's runtime dep chain.

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # CMake's codegen step shells out to scripts/codegen/run.js, which
      # requires('@lucid-softworks/react-native-linux-codegen'). The
      # workspace symlink resolves to that package's `main`, which is
      # the tsc-compiled lib/index.js — empty until we build it here.
      - name: Build packages (compiles codegen → lib/)
        run: pnpm -r run build

      - name: Install template deps (provides node_modules/react-native)
        working-directory: template
        run: |
          pnpm install --no-frozen-lockfile

      - name: Cache CMake FetchContent _deps
        uses: actions/cache@v5
        with:
          path: vnext/build/_deps
          key: vnext-deps-ubuntu-24.04-${{ hashFiles('vnext/cmake/Fetch*.cmake') }}

      - name: Configure vnext
        run: |
          cmake -S vnext -B vnext/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DREACT_NATIVE_ROOT=${{ github.workspace }}/template/node_modules/react-native

      - name: Build vnext
        # Build the shipped library, not `ninja all` — Folly's CMake
        # also stamps out example/test/benchmark binaries that aren't
        # on our ship path. Targeting `react_native_linux` builds its
        # transitive deps (folly, hermes, fmt, glog, double-conversion,
        # …) without the ~50 unused Folly executables.
        #
        # Tests (`-DREACT_NATIVE_LINUX_BUILD_TESTS=ON`) intentionally
        # stay off in CI: Hermes' bundled llvh ships a `gtest` target
        # whose includes are coupled to llvh internals (raw_ostream),
        # so it can't be reused by external test suites, and fetching
        # upstream googletest collides on the `gtest` / `gtest_main`
        # target names. Local test runs work via a separate configure
        # that skips Hermes. Untangling that is its own follow-up.
        run: |
          cmake --build vnext/build --parallel --target react_native_linux

  build-playground-bundle:
    # Runs the playground's bundle.mjs against each demo entry. Catches
    # bundle-level regressions that pure typecheck can't — e.g. the
    # paper-demo regression where esbuild's `__toClass` helper started
    # emitting `class extends X.Y` that hermesc rejects. Cheap: bundling
    # is a few seconds per entry and we re-use the lockfile install
    # from the lint-js job's cache.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Bundle every playground entry
        # Each entry exercises a different slice of the runtime:
        #   index.tsx              — default Tabs UI (most surface area)
        #   expo-blank.tsx         — minimal Expo template
        #   expo-modules-test.tsx  — every shimmed module's surface
        #   expo-router-tabs.tsx   — expo-router shim
        #   expo-tabs.tsx          — React Navigation Tabs
        #   smoke-demo.tsx         — next-batch library smoke probes
        #   paper-demo.tsx         — react-native-paper end-to-end
        #
        # App.tsx is not on the list — it's a component module that
        # index.tsx imports, not a self-contained entry that calls
        # registerRootComponent / renderFabric.
        #
        # Each entry must produce BOTH a non-empty `.bundle` (esbuild
        # output) AND a non-empty `.bundle.hbc` (hermesc output). The
        # bundler wipes the .hbc on hermesc failure, so a missing
        # bytecode file is the signal that paper-demo-style class
        # regressions slipped through.
        #
        # A failure in any one of these fails the job; the run-log
        # surfaces which entry tripped so the user knows where to
        # bisect.
        working-directory: apps/playground
        run: |
          set -e
          for entry in index.tsx expo-blank.tsx expo-modules-test.tsx \
                       expo-router-tabs.tsx expo-tabs.tsx smoke-demo.tsx \
                       paper-demo.tsx; do
            echo "::group::bundle $entry"
            RN_ENTRY="$entry" node bundle.mjs
            test -s linux/build/assets/index.linux.bundle
            test -s linux/build/assets/vendor.bundle
            test -s linux/build/assets/index.linux.bundle.hbc \
              || (echo "::error::$entry produced no .hbc — hermesc rejected the bundle"; exit 1)
            test -s linux/build/assets/vendor.bundle.hbc \
              || (echo "::error::$entry: vendor.bundle.hbc missing"; exit 1)
            echo "::endgroup::"
          done

  smoke-playground:
    # Boots the playground binary under xvfb and verifies it actually
    # paints. The bundle gate (`build-playground-bundle`) only checks
    # that esbuild + hermesc accept each entry; this job catches C++-
    # side mounting regressions — a crash in the Hermes runtime, a
    # broken Fabric mount, a missing JSI binding, etc. — that
    # wouldn't surface until someone runs the demo locally.
    #
    # ~10 min on a cold runner (Hermes + Folly FetchContent +
    # rn-renderer + playground); ~3 min on a cache hit. Cache key is
    # the same Fetch*.cmake hash as build-vnext, with a playground
    # prefix because the subdir layout differs.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install native build + xvfb deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ninja-build cmake pkg-config \
            libgtk-4-dev \
            libsoup-3.0-dev \
            libglib2.0-dev \
            libboost-all-dev \
            libdouble-conversion-dev \
            libevent-dev \
            libssl-dev \
            libgoogle-glog-dev \
            libgflags-dev \
            libfast-float-dev \
            zlib1g-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libnotify-dev \
            libsecret-1-dev \
            python3 python3-pip \
            xvfb imagemagick

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Same reason as build-vnext: codegen runs from CMake via
      # scripts/codegen/run.js which require()s the codegen package's
      # tsc-compiled main entry.
      - name: Build packages (compiles codegen → lib/)
        run: pnpm -r run build

      - name: Install template deps (provides node_modules/react-native)
        working-directory: template
        run: |
          pnpm install --no-frozen-lockfile

      - name: Cache CMake FetchContent _deps (playground tree)
        uses: actions/cache@v5
        with:
          path: apps/playground/linux/build/_deps
          key: playground-deps-ubuntu-24.04-${{ hashFiles('vnext/cmake/Fetch*.cmake') }}

      - name: Configure playground (incl. vnext as subdir)
        # The playground's CMakeLists adds vnext as a subdirectory, so
        # this single configure handles both. -DREACT_NATIVE_LINUX_DIR
        # points the playground at this repo's vnext, not a published
        # @lucid-softworks/react-native-linux from node_modules.
        run: |
          cmake -S apps/playground/linux -B apps/playground/linux/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DREACT_NATIVE_LINUX_DIR=${{ github.workspace }}/vnext \
            -DREACT_NATIVE_ROOT=${{ github.workspace }}/template/node_modules/react-native

      - name: Build playground binary (also builds matching hermesc)
        # MUST run before the bundle step. The CMake graph builds hermesc
        # as a transitive dep of react_native_linux, producing
        # apps/playground/linux/build/_deps/.../bin/hermesc against the
        # exact same Hermes source FetchHermes.cmake pins. bundle.mjs
        # prefers that binary over node_modules/hermes-compiler — the npm
        # package ships Hermes V1 (CalVer 250829098.0.10) whose bytecode
        # format is incompatible with the v0.16 runtime we link, and
        # mixing them crashes std::terminate inside startSurface.
        run: |
          cmake --build apps/playground/linux/build --parallel --target rn-linux-playground

      - name: Bundle index.tsx (uses the just-built hermesc)
        working-directory: apps/playground
        run: |
          RN_ENTRY=index node bundle.mjs

      - name: Smoke under xvfb
        # scripts/ci/smoke-playground.sh: xvfb-run → background the
        # binary → sleep settle-ms → ImageMagick `import` screenshot
        # → kill. Three assertions on top of "screenshot exists":
        #
        #   1. The process was still alive at screenshot time. Catches
        #      every crash before the first frame paints.
        #   2. ImageMagick `identify -format %k` reports ≥ 16 distinct
        #      pixel values. A bare Xvfb display with no client is
        #      pure black (k=1); even a minimal GTK window with
        #      anti-aliased default fonts trips dozens. Catches the
        #      "binary lives but never opens a window" failure mode.
        #   3. The captured stderr contains "JSX commit done" — fired
        #      by fabric.js's commit-success callback. That's
        #      end-to-end proof the C++ host installed the JSI
        #      bindings, Hermes evaluated the bundle, and the
        #      reconciler reached its first reconcile + commit.
        #
        # The C++ host reads its bundle URL from RN_BUNDLE_URL; we
        # pass the .hbc path so we exercise the Hermes-bytecode load
        # path (same one users hit in release builds).
        run: |
          scripts/ci/smoke-playground.sh \
            --executable apps/playground/linux/build/rn-linux-playground \
            --bundle-url "file://${{ github.workspace }}/apps/playground/linux/build/assets/index.linux.bundle.hbc" \
            --settle-ms 4000 \
            --output dist/ci-smoke/screenshot.png \
            --log dist/ci-smoke/app.log

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playground-smoke
          path: |
            dist/ci-smoke/screenshot.png
            dist/ci-smoke/app.log
          if-no-files-found: ignore

  smoke-expo-examples:
    # Iterate every example under external/expo-examples (vendored as a
    # submodule from expo/examples — MIT-licensed) and try to bundle +
    # boot each one through the same smoke harness `smoke-playground`
    # uses. Catches drift between our shim surface and what real Expo
    # apps actually reach for.
    #
    # Each example exports a default App; the driver synthesizes a
    # tiny wrapper that calls registerRootComponent(App). expo-router
    # apps (app/ dir layout) get a different wrapper that just does
    # `import 'expo-router/entry'`.
    #
    # Failures are EXPECTED and reported per-example in the summary —
    # the matrix records pass/bundle_fail/boot_fail/skipped without
    # failing the job. The published summary.txt lets us track which
    # examples flip green over time without re-running the matrix
    # locally to find out.
    runs-on: ubuntu-24.04
    needs: smoke-playground
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install native build + xvfb deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ninja-build cmake pkg-config \
            libgtk-4-dev \
            libsoup-3.0-dev \
            libglib2.0-dev \
            libboost-all-dev \
            libdouble-conversion-dev \
            libevent-dev \
            libssl-dev \
            libgoogle-glog-dev \
            libgflags-dev \
            libfast-float-dev \
            zlib1g-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libnotify-dev \
            libsecret-1-dev \
            python3 python3-pip \
            xvfb imagemagick

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Install template deps (provides node_modules/react-native)
        working-directory: template
        run: |
          pnpm install --no-frozen-lockfile

      - name: Cache CMake FetchContent _deps (playground tree)
        uses: actions/cache@v5
        with:
          path: apps/playground/linux/build/_deps
          key: playground-deps-ubuntu-24.04-${{ hashFiles('vnext/cmake/Fetch*.cmake') }}

      - name: Build playground binary (once, reused per example)
        # Configure pulls vnext as a subdir and builds the full lib +
        # binary in one pass. Reuses the Fetch* cache the smoke-
        # playground job warms up.
        run: |
          cmake -S apps/playground/linux -B apps/playground/linux/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DREACT_NATIVE_LINUX_DIR=${{ github.workspace }}/vnext \
            -DREACT_NATIVE_ROOT=${{ github.workspace }}/template/node_modules/react-native
          cmake --build apps/playground/linux/build --parallel --target rn-linux-playground

      - name: Run the matrix
        # 4-second settle per example × ~70 examples = ~5 min just
        # waiting; full sweep including bundle is ~15-20 min on a
        # cold runner. Each example's bundle log + smoke log + .png +
        # app.log are written under dist/ci-smoke-examples/ so a red
        # cell on the summary table links back to the actual cause.
        run: |
          bash scripts/ci/smoke-all-examples.sh --settle-ms 4000

      - name: Print summary
        if: always()
        run: |
          cat dist/ci-smoke-examples/summary.txt || true

      - name: Upload matrix artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: expo-examples-matrix
          path: |
            dist/ci-smoke-examples/summary.txt
            dist/ci-smoke-examples/*.png
            dist/ci-smoke-examples/*.log
          if-no-files-found: ignore

  coverage:
    # JS-side jest coverage; uploads lcov.info as an artifact. vnext's
    # C++ coverage isn't gated yet — the gtest target conflict with
    # Hermes' bundled llvh unittest blocks the cmake side; once that
    # lands the build-vnext job can also `ctest --label-regex vnext`.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # cli test suite require()s the codegen package, which needs
      # its tsc-compiled lib/ to exist before tests run.
      - name: Build packages (compiles codegen → lib/)
        run: pnpm -r run build
      - name: JS coverage
        run: |
          # --coverage works because each workspace's jest.config.js
          # consumes the default coverage reporter set.
          pnpm -r exec jest --coverage --coverageReporters=lcov --passWithNoTests
      - name: Aggregate lcov reports
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lcov
          mkdir -p coverage
          find packages -path '*/coverage/lcov.info' -print0 \
            | xargs -0 -r lcov $(find packages -path '*/coverage/lcov.info' -printf ' --add-tracefile %p') -o coverage/lcov.info || true
          if [ ! -s coverage/lcov.info ]; then
            echo "No lcov data produced yet — accepted while runtime tests are stubs." >&2
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: ignore
